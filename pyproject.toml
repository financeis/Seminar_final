[build-system]
requires = ["setuptools==65.5.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-alloc"
version = "0.1.0"
description = "Reproducible macroeconomic regime allocation research"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.3.3",
  "scipy==1.17.1",
  "scikit-learn==1.9.1",
  "matplotlib==3.10.8",
  "yfinance==1.3.0",
  "requests==2.34.2",
  "threadpoolctl==3.7.0",
  "exchange-calendars==4.13.2",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "PyYAML==6.0.3", "pypdf==6.10.2"]

[project.scripts]
regime-alloc = "regime_alloc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["real_data: checks against immutable acquired market data"]
